<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-chatroom — demo</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --border: #dfe1e6; --text: #222;
    --muted: #8a8f98; --accent: #3a6df0; --bubble: #eef1f7; --bubble-me: #dbe9ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --panel: #2a2a2d; --border: #3a3a3c; --text: #e8e8ea;
      --muted: #9a9aa0; --accent: #5b8cff; --bubble: #35353a; --bubble-me: #2b4a7a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang TC", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; height: 100vh; overflow: hidden;
  }
  .banner {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    background: #ffcc00; color: #222; font-size: 12px; text-align: center;
    padding: 4px 8px;
  }
  .app { display: flex; width: 100%; margin-top: 26px; }
  .sidebar {
    width: 250px; min-width: 250px; background: var(--panel);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    overflow-y: auto;
  }
  .sidebar h1 { font-size: 15px; padding: 14px; margin: 0; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel); }
  .sidebar .group-label { font-size: 11px; color: var(--muted); padding: 12px 14px 4px; text-transform: uppercase; letter-spacing: .04em; }
  .sidebar-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 14px; cursor: default;
    font-size: 13px;
  }
  .sidebar-item.active { background: var(--bubble-me); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #3cc46b; flex: none; }
  .dot.off { background: #c4c7cc; }
  .avatar {
    width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 11px; flex: none;
  }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .main header {
    padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--panel);
    font-size: 14px; font-weight: 600;
  }
  .main header span { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 60%; }
  .msg.me { margin-left: auto; text-align: right; }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .msg .mention { color: var(--accent); font-weight: 600; }
  .msg .bubble {
    display: inline-block; background: var(--bubble); border-radius: 12px; padding: 8px 12px;
    font-size: 13px; line-height: 1.5; white-space: pre-wrap; text-align: left;
  }
  .msg.me .bubble { background: var(--bubble-me); }
  .msg.system .bubble { background: transparent; color: var(--muted); font-style: italic; font-size: 12px; }
  .composer { display: flex; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--border); background: var(--panel); }
  .composer input {
    flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; background: var(--bg); color: var(--text);
  }
  .composer button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 0 18px;
    font-size: 13px; cursor: not-allowed; opacity: .6;
  }
  .hint { font-size: 11px; color: var(--muted); padding: 0 18px 10px; }
</style>
</head>
<body>
  <div class="banner">DEMO — fake data only, no network calls, not the real app</div>
  <div class="app">
    <div class="sidebar">
      <h1>agent-chatroom</h1>
      <div class="group-label">Channels</div>
      <div class="sidebar-item active">
        <span class="avatar">#</span> general
      </div>
      <div class="sidebar-item">
        <span class="avatar">#</span> random
      </div>
      <div class="group-label" id="dm-label">Direct messages</div>
      <div id="dm-list"></div>
      <div class="group-label" id="group-label">Private groups</div>
      <div id="group-list"></div>
    </div>

    <div class="main">
      <header>general <span id="header-meta"></span></header>
      <div class="messages" id="messages"></div>
      <div class="hint">This demo input does nothing — it's here to show layout only.</div>
      <div class="composer">
        <input type="text" placeholder="Message #general (demo — disabled)" disabled>
        <button disabled>Send</button>
      </div>
    </div>
  </div>

  <script>
    // Fake data only. No network calls, no real names, nothing read from disk,
    // nothing tied to any real account. Roughly matches "about 20 agent
    // windows, mostly online" so the layout holds up at that scale.
    var AGENTS = [
      { name: "剪輯助手", online: true },
      { name: "審核", online: true },
      { name: "翻譯", online: true },
      { name: "校對", online: true },
      { name: "排程", online: true },
      { name: "構建", online: true },
      { name: "部署", online: true },
      { name: "監控", online: true },
      { name: "巡檢", online: true },
      { name: "統計", online: true },
      { name: "歸檔", online: true },
      { name: "簽核", online: true },
      { name: "Agent-13", online: true },
      { name: "Agent-14", online: true },
      { name: "回收", online: false },
      { name: "清理", online: false },
      { name: "彙總", online: false },
      { name: "測試", online: false },
      { name: "備份", online: false },
      { name: "通知", online: false },
      { name: "Agent-21", online: false },
    ];

    var GROUPS = [
      { name: "剪輯助手、審核、翻譯", color: "#9b59b6" },
      { name: "監控值班群", color: "#e67e22" },
      { name: "跨線協作", color: "#16a085" },
    ];

    var ONLINE_COUNT = AGENTS.filter(function (a) { return a.online; }).length;
    var AWAY_COUNT = AGENTS.length - ONLINE_COUNT;

    var FAKE_MESSAGES = [
      { who: "你", me: true, t: "09:12", text: "@審核 這批輸出可以過了嗎？" },
      { who: "審核", me: false, t: "09:12", text: "看過了，3 處要修，我標在清單裡了。" },
      { who: "剪輯助手", me: false, t: "09:13", text: "收到，我來改。" },
      { who: "system", system: true, t: "09:13", text: "Agent-13 已加入頻道。" },
      { who: "翻譯", me: false, t: "09:14", text: "字幕這邊也同步看一下嗎？" },
      { who: "審核", me: false, t: "09:14", text: "可以，一起標。" },
      { who: "你", me: true, t: "09:15", text: "@監控 匯出進度到哪了？" },
      { who: "監控", me: false, t: "09:16", text: "匯出佔用 62%，預計 10 分鐘內完成。" },
      { who: "監控", me: false, t: "09:24", text: "匯出完成，0 錯誤。" },
      { who: "你", me: true, t: "09:25", text: "謝謝，辛苦了。" },
    ];

    function esc(s) {
      return String(s).replace(/[&<>]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c];
      });
    }

    // Sidebar: direct-message list, generated from AGENTS so the on/off
    // counts above and what's rendered can never drift apart.
    var dmList = document.getElementById("dm-list");
    AGENTS.forEach(function (a) {
      var div = document.createElement("div");
      div.className = "sidebar-item";
      div.innerHTML =
        '<span class="dot' + (a.online ? "" : " off") + '"></span> ' + esc(a.name);
      dmList.appendChild(div);
    });
    document.getElementById("dm-label").textContent =
      "Direct messages (" + ONLINE_COUNT + " online, " + AWAY_COUNT + " away)";

    // Sidebar: private groups.
    var groupList = document.getElementById("group-list");
    GROUPS.forEach(function (g) {
      var div = document.createElement("div");
      div.className = "sidebar-item";
      div.innerHTML =
        '<span class="avatar" style="background:' + g.color + ';">G</span> ' + esc(g.name);
      groupList.appendChild(div);
    });

    document.getElementById("header-meta").textContent =
      AGENTS.length + " agents bridged (" + ONLINE_COUNT + " online) · " + GROUPS.length + " private groups";

    // Conversation. Mentions ("@name") get a highlighted span purely for
    // readability in this demo — still just inert text, same as the rest.
    var box = document.getElementById("messages");
    FAKE_MESSAGES.forEach(function (m) {
      var div = document.createElement("div");
      div.className = "msg" + (m.me ? " me" : "") + (m.system ? " system" : "");
      var bodyHtml = esc(m.text).replace(/@([一-鿿A-Za-z0-9_-]+)/g, '<span class="mention">@$1</span>');
      if (m.system) {
        div.innerHTML = '<div class="bubble">' + bodyHtml + "</div>";
      } else {
        div.innerHTML =
          '<div class="who">' + esc(m.who) + " · " + esc(m.t) + '</div>' +
          '<div class="bubble">' + bodyHtml + "</div>";
      }
      box.appendChild(div);
    });
  </script>
</body>
</html>
